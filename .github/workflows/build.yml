name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Cache self-test
        run: .build/release/Yaga --self-test

      - name: Package app bundle
        run: ./build.sh --dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Yaga-arm64
          path: dist/*.zip
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-tagging is normal during development, so replace an existing
          # release's assets rather than failing on "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Yaga $GITHUB_REF_NAME" \
            --notes-file - <<'NOTES'
          Apple silicon build, signed ad-hoc — Gatekeeper does not recognise it.

          ```sh
          unzip Yaga-*-arm64.zip -d /Applications
          xattr -dr com.apple.quarantine /Applications/Yaga.app
          open /Applications/Yaga.app
          ```

          Without that: System Settings → Privacy & Security → **Open Anyway**.
          Needs a GIPHY or KLIPY API key, entered in Settings (⌘,).
          NOTES
