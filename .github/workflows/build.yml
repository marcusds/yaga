name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    # The secrets context is not available in a step-level `if`, so the check
    # for a configured certificate has to be hoisted to the job.
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are built from the commits since the previous tag,
          # which needs the history and tags a shallow clone leaves out.
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Cache self-test
        run: .build/release/Yaga --self-test

      # Without this the runner signs ad-hoc, and an ad-hoc signature pins the
      # designated requirement to that build's cdhash. Every release would then
      # be a different app to TCC, so the Accessibility grant that insert mode
      # needs would have to be re-given after each upgrade. Absent the secrets
      # this step is skipped and build.sh falls back to ad-hoc as before.
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # codesign would otherwise stop for an interactive "allow access?"
          # prompt that nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          # build.sh looks the identity up by name, so the keychain only has to
          # be on the search list.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '\"')

      - name: Package app bundle
        run: ./build.sh --dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Yaga-arm64
          path: dist/*.zip
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The heredoc stays quoted so the fenced block's backticks are not
          # taken as command substitution; the version is filled in after.
          # The subjects since the previous tag are the changelog; the
          # "Version x.y.z" commit is just the bump, so it is left out. On the
          # first tag there is no predecessor and the section is skipped.
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log --no-merges --reverse --format='- %s' "$PREV..$GITHUB_REF_NAME" \
              | grep -v '^- Version ' > changes.md || true
          fi
          if [ -s changes.md ]; then
            { echo "## What's changed"; echo; cat changes.md; echo; } > notes.md
          else
            : > notes.md
          fi

          cat >> notes.md <<'NOTES'
          ## Install

          Apple silicon build, not notarised — Gatekeeper does not recognise it.

          ```sh
          unzip -o Yaga-@VERSION@-arm64.zip -d /Applications
          xattr -dr com.apple.quarantine /Applications/Yaga.app
          open /Applications/Yaga.app
          ```

          Quit Yaga first if it is running. `-o` overwrites, so upgrading
          needs no extra steps.

          Without that: System Settings → Privacy & Security → **Open Anyway**.
          Needs a GIPHY API key, entered in Settings (⌘,).
          NOTES
          sed -i '' "s/@VERSION@/${GITHUB_REF_NAME#v}/" notes.md

          # Re-tagging is normal during development, so refresh an existing
          # release rather than failing on "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Yaga $GITHUB_REF_NAME" \
            --notes-file notes.md
